models:

  candidate_default:
    provider: "openai"
    model: "${CANDIDATE_MODEL:-/model}"
    api_key_env: "CANDIDATE_API_KEY"
    base_url: "${CANDIDATE_BASE_URL}"
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0
    # seed: 42
    request_timeout: 600
    max_retries: ${MODEL_MAX_RETRIES:-2}

  judge_default:
    provider: "openai"
    model: "${JUDGE_MODEL:-/model}"
    api_key_env: "JUDGE_API_KEY"
    base_url: "${JUDGE_BASE_URL}"
    max_tokens: 32768
    request_timeout: 300
    max_retries: ${MODEL_MAX_RETRIES:-2}

  report_default:
    provider: "openai"
    model: "${JUDGE_MODEL:-/model}"
    api_key_env: "JUDGE_API_KEY"
    base_url: "${JUDGE_BASE_URL}"
    temperature: 0.3
    max_tokens: 32768
    top_p: 1.0
    request_timeout: 300
    max_retries: ${MODEL_MAX_RETRIES:-2}
